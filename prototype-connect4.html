<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>TheARgame — Connect 4 Prototype</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0020;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    #header {
      width: 100%;
      padding: 14px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.4);
    }
    #logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
    #logo em { color: #c77dff; font-style: normal; }
    #location { font-size: 11px; color: #c77dff; text-align: right; line-height: 1.3; }

    #scene {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ICC / Man Mo composite landmark bg */
    #landmark-bg {
      width: 100%;
      height: 190px;
      background: linear-gradient(180deg, #0d0020 0%, #1a0050 40%, #2d0060 100%);
      position: relative;
      overflow: hidden;
    }
    #landmark-svg {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
    }

    #status-bar {
      width: 100%;
      max-width: 480px;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
    }
    #turn-msg { font-size: 14px; font-weight: 600; }
    #move-count { font-size: 12px; color: #9b8ab8; }

    #grid-wrap {
      width: 100%;
      max-width: 480px;
      padding: 12px 16px;
      background: rgba(10,0,30,0.8);
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      width: 100%;
    }
    .cell {
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
      border: 2px solid rgba(255,255,255,0.06);
    }
    .cell:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
    .cell.p1 { background: #c77dff; border-color: #a855f7; box-shadow: 0 0 10px rgba(199,125,255,0.5); }
    .cell.p2 { background: #ff6b6b; border-color: #ef4444; box-shadow: 0 0 10px rgba(255,107,107,0.5); }
    .cell.win { animation: pulse 0.6s ease infinite alternate; }
    @keyframes pulse {
      from { transform: scale(1); box-shadow: 0 0 10px rgba(255,215,0,0.5); }
      to   { transform: scale(1.1); box-shadow: 0 0 20px rgba(255,215,0,0.9); border-color: #ffd700; }
    }
    .col-btn {
      background: rgba(199,125,255,0.15);
      border: none;
      border-radius: 6px 6px 0 0;
      color: #c77dff;
      font-size: 16px;
      padding: 4px 0;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }
    .col-btn:hover { background: rgba(199,125,255,0.3); }
    #col-btns {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      width: 100%;
      margin-bottom: 4px;
    }

    #win-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 30px;
    }
    #win-overlay.show { display: flex; }
    #win-emoji { font-size: 64px; }
    #win-title { font-size: 28px; font-weight: 800; }
    #win-sub { font-size: 15px; color: #9b8ab8; max-width: 280px; }
    #btn-reset {
      background: #c77dff;
      color: #0d0020;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    #legend {
      display: flex;
      gap: 16px;
      padding: 8px 16px;
      font-size: 12px;
    }
    .legend-dot {
      display: inline-block;
      width: 12px; height: 12px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    #bottom-note {
      font-size: 11px;
      color: #6b5b80;
      padding: 8px 16px 16px;
      text-align: center;
      max-width: 480px;
    }
  </style>
</head>
<body>

<div id="header">
  <div id="logo">the<em>AR</em>game</div>
  <div id="location">📍 Man Mo Temple<br>Hong Kong Island</div>
</div>

<div id="scene">
  <div id="landmark-bg">
    <svg id="landmark-svg" viewBox="0 0 480 190" xmlns="http://www.w3.org/2000/svg">
      <!-- Stylised HK skyline / ICC building silhouettes -->
      <g fill="#1a0050" opacity="0.9">
        <!-- ICC tower (West Kowloon) - tallest -->
        <rect x="300" y="20" width="28" height="170"/>
        <rect x="294" y="40" width="40" height="10"/><!-- set-back -->
        <polygon points="314,20 306,35 322,35"/><!-- spire -->
        <!-- HSBC-style (Central) -->
        <rect x="200" y="60" width="32" height="130"/>
        <rect x="196" y="80" width="40" height="8"/>
        <rect x="192" y="100" width="48" height="6"/>
        <!-- Bank of China -->
        <polygon points="100,170 120,170 130,50 110,40"/>
        <polygon points="110,40 130,50 120,170 100,170"/>
        <!-- Man Mo Temple roof (foreground) -->
        <polygon points="30,190 450,190 430,155 240,120 50,155"/>
        <polygon points="60,155 420,155 400,128 240,100 80,128"/>
        <polygon points="30,155 60,155 45,132"/>
        <polygon points="450,155 420,155 435,132"/>
        <rect x="100" y="155" width="16" height="35"/>
        <rect x="155" y="155" width="16" height="35"/>
        <rect x="309" y="155" width="16" height="35"/>
        <rect x="364" y="155" width="16" height="35"/>
        <rect x="205" y="165" width="70" height="25" rx="3"/>
        <ellipse cx="240" cy="165" rx="35" ry="12"/>
      </g>
      <!-- Stars / atmosphere -->
      <circle cx="50" cy="30" r="1.5" fill="white" opacity="0.4"/>
      <circle cx="150" cy="15" r="1" fill="white" opacity="0.3"/>
      <circle cx="380" cy="25" r="1.5" fill="white" opacity="0.4"/>
      <circle cx="420" cy="60" r="1" fill="white" opacity="0.25"/>
      <circle cx="70" cy="70" r="1" fill="white" opacity="0.3"/>
    </svg>
  </div>
</div>

<div id="status-bar">
  <div id="turn-msg">Player 1's turn</div>
  <div id="move-count">Move 1</div>
</div>

<div id="grid-wrap">
  <div id="col-btns"></div>
  <div id="grid"></div>
</div>

<div id="legend">
  <span><span class="legend-dot" style="background:#c77dff"></span>Player 1</span>
  <span><span class="legend-dot" style="background:#ff6b6b"></span>Player 2</span>
</div>

<div id="bottom-note">
  Connect 4 in a row — horizontal, vertical, or diagonal — to win.<br>
  Playing at Man Mo Temple, Hong Kong.
</div>

<!-- Win overlay -->
<div id="win-overlay">
  <div id="win-emoji"></div>
  <div id="win-title"></div>
  <div id="win-sub"></div>
  <button id="btn-reset" onclick="resetGame()">Play Again</button>
</div>

<script>
  const ROWS = 6, COLS = 7;
  let board, currentPlayer, moveCount, gameOver;

  function initBoard() {
    board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    currentPlayer = 1;
    moveCount = 1;
    gameOver = false;
    renderGrid();
    renderColBtns();
    updateStatus();
  }

  function renderColBtns() {
    const wrap = document.getElementById('col-btns');
    wrap.innerHTML = Array.from({length: COLS}, (_,c) =>
      `<button class="col-btn" onclick="drop(${c})">▼</button>`
    ).join('');
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = `cell-${r}-${c}`;
        if (board[r][c] === 1) cell.classList.add('p1');
        if (board[r][c] === 2) cell.classList.add('p2');
        cell.onclick = () => drop(c);
        grid.appendChild(cell);
      }
    }
  }

  function drop(col) {
    if (gameOver) return;
    // Find lowest empty row
    let row = -1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][col] === 0) { row = r; break; }
    }
    if (row === -1) return; // column full

    board[row][col] = currentPlayer;

    const cell = document.getElementById(`cell-${row}-${col}`);
    cell.classList.add(currentPlayer === 1 ? 'p1' : 'p2');

    const win = checkWin(row, col);
    if (win) {
      gameOver = true;
      win.forEach(([r,c]) => document.getElementById(`cell-${r}-${c}`).classList.add('win'));
      setTimeout(() => showWin(currentPlayer), 500);
      return;
    }

    if (board[0].every(v => v !== 0)) {
      setTimeout(() => showDraw(), 400);
      return;
    }

    currentPlayer = currentPlayer === 1 ? 2 : 1;
    moveCount++;
    updateStatus();
  }

  function checkWin(row, col) {
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    const p = board[row][col];
    for (const [dr,dc] of dirs) {
      const cells = [[row, col]];
      for (let i = 1; i < 4; i++) {
        const r = row + dr*i, c = col + dc*i;
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS || board[r][c] !== p) break;
        cells.push([r, c]);
      }
      for (let i = 1; i < 4; i++) {
        const r = row - dr*i, c = col - dc*i;
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS || board[r][c] !== p) break;
        cells.push([r, c]);
      }
      if (cells.length >= 4) return cells.slice(0, 4);
    }
    return null;
  }

  function updateStatus() {
    const names = ['', 'Player 1', 'Player 2'];
    const colors = ['', '#c77dff', '#ff6b6b'];
    const msg = document.getElementById('turn-msg');
    msg.textContent = names[currentPlayer] + '\'s turn';
    msg.style.color = colors[currentPlayer];
    document.getElementById('move-count').textContent = 'Move ' + moveCount;
  }

  function showWin(player) {
    const overlay = document.getElementById('win-overlay');
    document.getElementById('win-emoji').textContent = player === 1 ? '🏆' : '🎉';
    document.getElementById('win-title').textContent =
      (player === 1 ? 'Player 1' : 'Player 2') + ' Wins!';
    document.getElementById('win-title').style.color = player === 1 ? '#c77dff' : '#ff6b6b';
    document.getElementById('win-sub').textContent =
      'Connected 4 in a row at Man Mo Temple, Hong Kong.';
    overlay.classList.add('show');
  }

  function showDraw() {
    const overlay = document.getElementById('win-overlay');
    document.getElementById('win-emoji').textContent = '🤝';
    document.getElementById('win-title').textContent = 'Draw!';
    document.getElementById('win-title').style.color = '#fff';
    document.getElementById('win-sub').textContent = 'No spaces left. Well played!';
    overlay.classList.add('show');
  }

  function resetGame() {
    document.getElementById('win-overlay').classList.remove('show');
    initBoard();
  }

  initBoard();
</script>
</body>
</html>
